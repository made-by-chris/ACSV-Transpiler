<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Export your old ACSV draft</title><h1>Export your old draft</h1><p>Browser drafts belong to the website where they were saved. Use this page on acsv.vercel.app to download an old draft before opening the new editor.</p><button id="save">Download draft</button><p id="status" role="status"></p><script>document.getElementById('save').onclick=()=>{try{const current=JSON.parse(localStorage.getItem('acsv.workbench.v1')||'null');const input=current?.input??localStorage.getItem('ACSVEditor_input');if(input===null){document.getElementById('status').textContent='No draft found on this host.';return;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([input],{type:'text/plain'}));a.download='saved-draft.acsv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch{document.getElementById('status').textContent='Unable to read browser storage.';}};</script><p><a href="https://acsv.majaku.com/">Open ACSV</a></p></html>
